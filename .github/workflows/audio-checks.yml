name: Audio regression checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix ops/relay-server
      - run: npm run test:recovery
      - run: npm run test:audio
      - run: npx tsc --noEmit
      - run: npm run lint
